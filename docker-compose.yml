services:
  portfolio:
    image: ghcr.io/iztochenvalk/portfolio-portfolio:latest
    container_name: portfolio
    restart: unless-stopped
    ports:
      # Exposé en local uniquement : nginx (hôte) fait le reverse proxy + HTTPS
      - "127.0.0.1:3000:3000"
    networks: [web]

  cybersecurity-quiz:
    image: ghcr.io/iztochenvalk/portfolio-cybersecurity-quiz:latest
    container_name: cybersecurity-quiz
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:80"
    networks: [web]

  cybersecurity-planner:
    image: ghcr.io/iztochenvalk/portfolio-cybersecurity-planner:latest
    container_name: cybersecurity-planner
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:80"
    networks: [web]

  mario-game:
    image: ghcr.io/iztochenvalk/portfolio-mario-game:latest
    container_name: mario-game
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:80"
    networks: [web]

# Réseau partagé avec asso-platform : permet à son Caddy de servir le portfolio en HTTPS.
# À créer une fois sur la VM :  docker network create web
networks:
  web:
    external: true
